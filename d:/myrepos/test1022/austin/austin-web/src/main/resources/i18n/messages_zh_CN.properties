# Austin Message Platform - Chinese Messages

# Response Status
response.SUCCESS=操作成功
response.FAIL=操作失败

# Error Messages
error.ERROR_500=服务器未知错误
error.ERROR_400=错误请求
error.CLIENT_BAD_PARAMETERS=客户端参数错误
error.TEMPLATE_NOT_FOUND=找不到模板或模板已被删除
error.TOO_MANY_RECEIVER=传入的接收者大于100个
error.DO_NOT_NEED_LOGIN=非测试环境，无须登录
error.NO_LOGIN=还未登录，请先登录
error.SERVICE_ERROR=服务执行异常
error.RESOURCE_NOT_FOUND=资源不存在

# Pipeline Errors
error.CONTEXT_IS_NULL=流程上下文为空
error.BUSINESS_CODE_IS_NULL=业务代码为空
error.PROCESS_TEMPLATE_IS_NULL=流程模板配置为空
error.PROCESS_LIST_IS_NULL=业务处理器配置为空
