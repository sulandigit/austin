# Austin Message Platform - English Messages

# Response Status
response.SUCCESS=Operation successful
response.FAIL=Operation failed

# Error Messages
error.ERROR_500=Internal server error
error.ERROR_400=Bad request
error.CLIENT_BAD_PARAMETERS=Invalid client parameters
error.TEMPLATE_NOT_FOUND=Template not found or deleted
error.TOO_MANY_RECEIVER=Receiver count exceeds limit of 100
error.DO_NOT_NEED_LOGIN=No login required in non-test environment
error.NO_LOGIN=Not logged in, please login first
error.SERVICE_ERROR=Service execution error
error.RESOURCE_NOT_FOUND=Resource not found

# Pipeline Errors
error.CONTEXT_IS_NULL=Process context is null
error.BUSINESS_CODE_IS_NULL=Business code is null
error.PROCESS_TEMPLATE_IS_NULL=Process template configuration is null
error.PROCESS_LIST_IS_NULL=Business processor configuration is null
